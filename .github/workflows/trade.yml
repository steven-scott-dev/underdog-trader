name: underdog-trader

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading pass
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
          LIVE_MODE: ${{ secrets.LIVE_MODE }}
        run: python -m trader.run_once

      - name: Update dashboard
        run: |
          git config user.name "underdog-trader"
          git config user.email "underdog-trader@local"
          git add state.json STATUS.md status.json
          git diff --cached --quiet || git commit -m "dashboard update"
          git push
